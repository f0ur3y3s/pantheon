[project]
name = "pantheon"
version = "0.1.0"
description = "Central control plane and OpenAI-compatible gateway for the homelab LLM machines"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "psutil>=6.0",
]

[project.scripts]
pantheon-agent = "pantheon.agent.__main__:main"
pantheon-gateway = "pantheon.gateway.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "anyio>=4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantheon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
